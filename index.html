<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz MP3 i MP4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #4CAF50;
        }

        .media-container {
            margin: 30px auto;
            max-width: 600px;
        }

        audio, video {
            width: 100%;
            outline: none;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            background-color: #000;
        }
    </style>
</head>
<body>
    <h1>🎧 Odtwarzacz MP3 i 🎬 MP4</h1>

    <div class="media-container">
        <h2>Odtwarzacz MP3</h2>
        <audio controls>
            <source src="mp3.mp3" type="audio/mpeg">
            Twoja przeglądarka nie obsługuje odtwarzania dźwięku.
        </audio>
    </div>

    <div class="media-container">
        <h2>Odtwarzacz MP4</h2>
        <video controls>
            <source src="3sec.mp4" type="video/mp4">
            Twoja przeglądarka nie obsługuje odtwarzania wideo.
        </video>
    </div>

</body>
</html>
