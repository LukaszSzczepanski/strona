<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz MP3 / MP4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #4CAF50;
        }

        .player-box {
            margin: 40px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            box-shadow: 0 0 10px #000;
        }

        video, audio {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            margin-top: 15px;
        }

        input[type="file"],
        input[type="text"] {
            width: 80%;
            max-width: 450px;
            margin: 10px auto;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: none;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        .source-option {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>🎵🎬 Odtwarzacz MP3 / MP4</h1>

    <!-- Sekcja audio -->
    <div class="player-box">
        <h2>Odtwarzacz MP3</h2>

        <div class="source-option">
            <p><b>Wybierz plik z komputera:</b></p>
            <input type="file" id="audioFile" accept="audio/mp3,audio/mpeg">
        </div>

        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- Sekcja wideo -->
    <div class="player-box">
        <h2>Odtwarzacz MP4</h2>

        <div class="source-option">
            <p><b>Wybierz plik z komputera:</b></p>
            <input type="file" id="videoFile" accept="video/mp4">
        </div>

        <div class="source-option">
            <p><b>Lub wklej link z internetu:</b></p>
            <input type="text" id="videoLink" placeholder="Wklej link do pliku MP4">
            <br>
            <button onclick="loadVideoFromLink()">Odtwórz z linku</button>
        </div>

        <video id="videoPlayer" controls></video>
    </div>

    <script>
        // Obsługa MP3 z komputera
        document.getElementById('audioFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const player = document.getElementById('audioPlayer');
                player.src = url;
                player.play();
            }
        });

        // Obsługa MP3 z linku
        function loadAudioFromLink() {
            const link = document.getElementById('audioLink').value.trim();
            const player = document.getElementById('audioPlayer');

            if (link === "") {
                alert("Wklej link do pliku MP3!");
                return;
            }

            player.src = link;
            player.play();
        }

        // Obsługa MP4 z komputera
        document.getElementById('videoFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const player = document.getElementById('videoPlayer');
                player.src = url;
                player.play();
            }
        });

        // Obsługa MP4 z linku
        function loadVideoFromLink() {
            const link = document.getElementById('videoLink').value.trim();
            const player = document.getElementById('videoPlayer');

            if (link === "") {
                alert("Wklej link do pliku MP4!");
                return;
            }

            player.src = link;
            player.play();
        }
    </script>
</body>
</html>
